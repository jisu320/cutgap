<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컷값 — 앞머리컷 걸러낸 미용실 커트 가격</title>
<meta name="description" content="미용실 커트 가격을 앞머리컷·부분컷 제외하고 여성/남성 기준으로 최저가순 정렬한다.">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <h1>컷값</h1>
      <p>앞머리컷 걸러낸 커트 가격만</p>
    </div>
    <div class="stamp" id="stamp">데이터 불러오는 중…</div>
  </header>

  <div class="controls">
    <div class="field">
      <span class="lab">지역</span>
      <select id="region" aria-label="지역 선택"><option>불러오는 중…</option></select>
      <button type="button" class="chip" id="near">내 위치</button>
    </div>
    <div class="field">
      <span class="lab">성별</span>
      <div class="seg" id="sexSeg">
        <button type="button" data-sex="w" aria-pressed="true">여성</button>
        <button type="button" data-sex="m" aria-pressed="false">남성</button>
      </div>
    </div>
    <div class="field">
      <span class="lab">정렬</span>
      <div class="seg" id="sortSeg">
        <button type="button" data-sort="price" aria-pressed="true">낮은 가격순</button>
        <button type="button" data-sort="name" aria-pressed="false">이름순</button>
      </div>
    </div>
    <button type="button" class="chip" id="hideVoid" aria-pressed="false">가격 미표기 숨기기</button>
    <span class="locked" title="이 사이트의 목적이라서 끌 수 없다">✓ 앞머리·부분컷 제외</span>
  </div>

  <div class="split">
    <section class="panel">
      <div class="panel-head">
        <h2 id="listTitle">여성 커트 · 낮은 가격순</h2>
        <span id="listCount"></span>
      </div>
      <div class="list" id="list"><div class="empty">지역을 고르면 목록이 나온다.</div></div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <h2>지도</h2>
        <span>마커 = 순위 + 가격</span>
      </div>
      <div id="map"></div>
    </section>
  </div>

  <footer>
    <p>가격은 각 업소의 네이버 플레이스 메뉴판에서 <b>커트로 분류된 항목</b>만 골라, 앞머리·부분컷·학생컷 등을 제외하고 성별별 최저가를 뽑은 값이다. 판정 근거가 된 원본 메뉴명을 항목마다 함께 보여준다.</p>
    <p>수집 시점 기준이라 실제 요금과 다를 수 있다. 방문 전 업소에 확인해라. 잘못된 항목은 <a id="issueLink" href="#">오분류 신고</a>로 알려주면 규칙을 고친다.</p>
  </footer>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
