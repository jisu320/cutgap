name: 가격 갱신

# 하루 한 번, 한국 시간 새벽 4시. 트래픽이 가장 적은 시간대에만 돈다.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh(가격 갱신) / enumerate(목록 수집)"
        type: choice
        default: refresh
        options: [refresh, enumerate]
      budget:
        description: "이번 실행 최대 요청 수"
        default: "2000"
      level:
        description: "enumerate 단계 (sido / sigungu / dong)"
        type: choice
        default: sigungu
        options: [sido, sigungu, dong]

concurrency:
  group: cutgap-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330            # job 상한 6시간보다 여유를 둔다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 목록 수집
        if: github.event.inputs.mode == 'enumerate'
        run: |
          python -m cutprice.enumerate_places \
            --level "${{ github.event.inputs.level }}" \
            --budget "${{ github.event.inputs.budget }}" \
            --delay "${{ vars.REQUEST_DELAY || '3.0' }}"

      - name: 가격 갱신
        if: github.event.inputs.mode != 'enumerate'
        run: |
          python -m cutprice.refresh_prices \
            --budget "${{ github.event.inputs.budget || vars.DAILY_BUDGET || '2000' }}" \
            --delay "${{ vars.REQUEST_DELAY || '3.0' }}"

      - name: 변경분 커밋
        run: |
          if [ -z "$(git status --porcelain docs/data)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
          git push
